#:schema node_modules/wrangler/config-schema.json
name = "vzmail"
main = "cloudflare/worker-mail-links.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]

# Static SPA assets built by `npm run build` (`vite build` -> `./dist`)
# Hashed bundles under /assets/* bypass the Worker and serve directly from Cloudflare's edge CDN.
# Navigation routes, /api/*, /s/* shortlinks, and *.imy.li subdomains execute the Worker first.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/*",
  "!/assets/*",
  "!/icons/*",
  "!/icon-*.png",
  "!/apple-touch-icon*.png",
  "!/favicon.svg",
  "!/og-banner.jpg",
  "!/robots.txt",
  "!/sitemap.xml",
  "!/cloudflare_imy_mail_links_relay.php.txt"
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

# 2-in-1 Cloudflare Worker Custom Routes (uncomment once zones are attached in Cloudflare):
# routes = [
#   { pattern = "mail.vz.gay/*", zone_name = "vz.gay" },
#   { pattern = "links.vz.gay/*", zone_name = "vz.gay" },
#   { pattern = "imy.li/*", zone_name = "imy.li" },
#   { pattern = "*.imy.li/*", zone_name = "imy.li" }
# ]

[vars]
APP_DOMAIN = "mail.vz.gay"
LINKS_DOMAIN = "links.vz.gay"
PRIMARY_MAIL_DOMAIN = "imy.li"
AUTH0_DOMAIN = "accounts.vz.gay"
ACCOUNT_DASHBOARD_URL = "https://myaccount.vz.gay"
SPONSOR_DOMAIN = "jajanserver.com"
DAILY_OUTBOUND_LIMIT = "25"

# Optional Production Bindings — uncomment after provisioning resources in Cloudflare Dashboard:
#
# 1. Cloudflare Email Sending (requires domain onboarded under Compute > Email Service):
# [[send_email]]
# name = "SEND_EMAIL"
#
# 2. Ephemeral Transit Buffer KV (Zero permanent mailbox retention; auto-TTL + Pop-and-Purge):
[[kv_namespaces]]
binding = "MAIL_TRANSIT_KV"
id = "b330955476094cc2820053732cbb4471"
#
# 3. VZ Links Shortener & Static Bio KV:
[[kv_namespaces]]
binding = "LINKS_KV"
id = "9fb255e46c7b4501922aa6881c806493"
#
# 4. Optional Relay Auth Secret (set via CLI, NEVER commit):
#    npx wrangler secret put RELAY_AUTH_TOKEN
