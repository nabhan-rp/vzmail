#:schema node_modules/wrangler/config-schema.json
name = "vzmail"
main = "cloudflare/worker-mail-links.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# 2-in-1 Cloudflare Worker Custom Routes (active for vz.gay + imy.li):
routes = [
  { pattern = "mail.vz.gay/*", zone_name = "vz.gay" },
  { pattern = "links.vz.gay/*", zone_name = "vz.gay" },
  { pattern = "imy.li/*", zone_name = "imy.li" },
  { pattern = "*.imy.li/*", zone_name = "imy.li" }
]

# Static SPA assets built by `npm run build` (`vite build` -> `./dist`)
# Note: `vite.config.ts` automatically renames `*.php.txt` -> `*.php` inside `./dist` at build time
# while keeping source files as `*.php.txt` in GitHub & AI Studio.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/*",
  "!/assets/*",
  "!/icons/*",
  "!/icon-*.png",
  "!/apple-touch-icon*.png",
  "!/favicon.svg",
  "!/og-banner.jpg",
  "!/cloudflare_imy_mail_links_relay.php"
]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
APP_DOMAIN = "mail.vz.gay"
LINKS_DOMAIN = "links.vz.gay"
PRIMARY_MAIL_DOMAIN = "imy.li"
AUTH0_DOMAIN = "accounts.vz.gay"
ACCOUNT_DASHBOARD_URL = "https://myaccount.vz.gay"
SPONSOR_DOMAIN = "jajanserver.com"
DAILY_OUTBOUND_LIMIT = "25"
# Outbound email provider mode: "auto" | "cpanel_relay" | "resend" | "brevo" | "cloudflare"
# In "auto" mode, Worker checks in order: cpanel_relay -> resend -> brevo -> cloudflare
OUTBOUND_PROVIDER = "auto"

# Production Bindings:
#
# 1. Ephemeral Transit Buffer KV (Zero permanent mailbox retention; auto-TTL + Pop-and-Purge):
[[kv_namespaces]]
binding = "MAIL_TRANSIT_KV"
id = "b330955476094cc2820053732cbb4471"

# 2. VZ Links Shortener & Multi-Page Bio KV (active immediately & automatic fallback when D1 is not bound):
[[kv_namespaces]]
binding = "LINKS_KV"
id = "9fb255e46c7b4501922aa6881c806493"

# 3. Recommended Upgrade — Cloudflare D1 SQLite Database for Multi-Page Bio & Shortlinks (`LINKS_DB`):
#    Run:
#      npx wrangler d1 create vzlinks-db
#      npx wrangler d1 execute vzlinks-db --remote --file=cloudflare/schema.sql
#    Then uncomment below and replace database_id:
 [[d1_databases]]
 binding = "LINKS_DB"
 database_name = "vzlinks-db"
 database_id = "9b82b9f1-e78c-4194-a038-435892efacfe"

# 4. Cloudflare R2 Bucket for Bio Link AVIF Profile Photos & Ephemeral Email Attachments (`LINKS_MEDIA_R2`):
#    Free Tier: 10 GB storage, 10M reads/mo, $0 egress.
#    Recommended R2 Lifecycle Rule (Cloudflare Dashboard -> R2 -> vzlinks-media -> Settings):
#      Prefix: mail-ephemeral/  |  Action: Delete objects after 7 days
[[r2_buckets]]
binding = "LINKS_MEDIA_R2"
bucket_name = "vzlinks-media"

# 5. Cloudflare Images Binding (`IMAGES`) for automatic server-side image -> AVIF conversion:
#    Free Tier: 5,000 unique transformations/month. Automatically falls back if not enabled on account.
[images]
binding = "IMAGES"

# 6. Optional Cloudflare Email Sending (uncomment after onboarding imy.li in Compute > Email Service):
#    Free plan: verified destination addresses only; Workers Paid: any recipient.
# [[send_email]]
# name = "SEND_EMAIL"

# 7. Outbound Provider Secrets (set via Workers Dashboard Settings -> Variables and Secrets, or CLI):
#    Option A — Hybrid cPanel/WHM Outbound Relay ($0, zero storage on karya.kreasi.org):
#      npx wrangler secret put CPANEL_RELAY_URL
#      npx wrangler secret put CPANEL_RELAY_SECRET
#    Option B — Resend Free Tier (3,000 emails/month):
#      npx wrangler secret put RESEND_API_KEY
#    Option C — Brevo Free Tier (300 emails/day — use standard v3 API key `xkeysib-...`):
#      npx wrangler secret put BREVO_API_KEY
#    Optional API Relay Protection Token:
#      npx wrangler secret put RELAY_AUTH_TOKEN
